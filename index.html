<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AY2526T3-CCDEVAP-HO4-Team1-Aguirre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <div class="header-container">
        <h1>CampusCart</h1>
        <p class="subtitle">by Mikyla Kirsten P. Aguirre of S16 Team 1</p>
    </div>

    <div class="container">

        <div class="row g-4">

            <div class="col-lg-4 col-md-12">
                <div class="card p-3 shadow-sm h-100">
                    <h5 class="card-title text-center text-secondary mb-3">Claims per Month</h5>
                    <div class="chart-container">
                        <canvas id="claimsChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-12">
                <div class="card p-3 shadow-sm h-100">
                    <h5 class="card-title text-center text-secondary mb-3">Ratings Breakdown</h5>
                    <div class="chart-container">
                        <canvas id="ratingsChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-12">
                <div class="card p-3 shadow-sm h-100">
                    <h5 class="card-title text-center text-secondary mb-3">User Status Report</h5>
                    <div class="chart-container">
                        <canvas id="userStatusChart"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>
</html>
